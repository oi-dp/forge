# BACKGROUND
background {
  monitor =
  path = ~/media/pictures/moonwalls/wall-moon8.png
  blur_passes = 0
  contrast = 0.7
  brightness = 0.4
  vibrancy = 0.3
  vibrancy_darkness = 0.5
}

# GENERAL
general {}

# Clock
label {
  monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(128, 160, 255, 0.70)
    font_size = 90
    font_family = Iosevka NF Bold
    position = 0, 350
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %d %B")"
    color = rgba(192, 202, 246, 0.70)
    font_size = 40
    font_family = Iosevka NF Bold
    position = 0, 250
    halign = center
    valign = center
}

# Profile-Pic
image {
    monitor =
    path = ~/media/pictures/beungeut.png
    border_size = 2
    border_color = rgba(133, 177, 247, 0)
    size = 170
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd =
    position = 0, 40
    halign = center
    valign = center
}

# USER-BOX
shape {
    monitor =
    size = 300, 60
    color = rgba(6, 6, 6, 0.8)
    rounding = -1
    border_size = 2
    border_color = rgba(192, 202, 246, 0.8)
    rotate = 0
    xray = false

    position = 0, -130
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text = $USER
    color = rgba(255, 84, 84, 0.80)
    font_size = 18
    font_family = JetBrains Mono NF Bold
    position = 0, -130
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2 # 0.2 - 0.8
    dots_spacing = 0.2 # 0.0 - 1.0
    dots_center = true
    outer_color = rgba(18, 18, 18, 0.5)
    inner_color = rgba(192, 202, 246, 0.5)
    font_color = rgb(50, 50, 50)
    fade_on_empty = false
    font_family = Iosevka Mono NF Bold
    placeholder_text = <i><span foreground="##12121299">Password </span></i>
    hide_input = false
    position = 0, -210
    halign = center
    valign = center
}

